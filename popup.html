<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATV Bilingual</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 280px;
        background: #1a1a1a;
        color: #f0f0f0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 13px;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #2a2a2a;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
      }
      header p {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }
      .section {
        padding: 14px 16px;
        border-bottom: 1px solid #2a2a2a;
      }
      .section label {
        display: block;
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: #f0f0f0;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 13px;
        appearance: none;
        cursor: pointer;
      }
      select:focus {
        outline: 1px solid #ffe566;
      }
      .btn-apply {
        display: block;
        width: calc(100% - 32px);
        margin: 14px 16px;
        padding: 10px;
        background: #ffe566;
        color: #1a1a1a;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-apply:hover {
        background: #ffd633;
      }
      #status {
        text-align: center;
        font-size: 11px;
        color: #888;
        padding: 0 16px 14px;
        min-height: 18px;
      }
      .loading {
        color: #555;
        font-size: 12px;
        padding: 8px 0;
      }
      .btn-settings {
        display: block;
        width: calc(100% - 32px);
        margin: 0 16px 12px;
        padding: 10px;
        background: #2a2a2a;
        color: #f0f0f0;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-settings:hover {
        background: #313131;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎬 ATV Bilingual</h1>
      <p>Apple TV+ バイリンガル字幕</p>
    </header>

    <div class="section">
      <label for="primary-lang">メイン字幕（上段）</label>
      <select id="primary-lang">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div class="section">
      <label for="secondary-lang">サブ字幕（下段）</label>
      <select id="secondary-lang">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <button class="btn-apply" id="apply-btn" type="button">適用</button>
    <button class="btn-settings" id="open-options-btn" type="button">
      設定を開く
    </button>
    <div id="status" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
