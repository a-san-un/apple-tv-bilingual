<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple TV+ Bilingual Subtitles Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-page">
      <header class="page-header">
        <div class="page-header__text">
          <h1>Apple TV+ Bilingual Subtitles</h1>
          <p class="page-description">字幕表示や学習補助の設定を行います。</p>
        </div>
        <div class="header-actions">
          <button id="saveBtn" class="primary-button" type="button">
            保存
          </button>
        </div>
      </header>

      <p id="saveStatus" class="save-status" aria-live="polite"></p>

      <form id="optionsForm" class="settings-form">
        <!-- 基本設定 -->
        <section class="settings-section">
          <h2>基本設定</h2>
          <div class="field-grid">
            <label class="field">
              <span class="field-label">勉強している言語</span>
              <select id="primaryLang" required>
                <option value="en">英語</option>
                <option value="ja">日本語</option>
                <option value="zh">中国語</option>
                <option value="ko">韓国語</option>
                <option value="fr">フランス語</option>
                <option value="de">ドイツ語</option>
                <option value="es">スペイン語</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">自分の言語</span>
              <select id="secondaryLang">
                <option value="">ブラウザ言語を使う</option>
                <option value="ja">日本語</option>
                <option value="en">英語</option>
                <option value="zh">中国語</option>
                <option value="ko">韓国語</option>
                <option value="fr">フランス語</option>
                <option value="de">ドイツ語</option>
                <option value="es">スペイン語</option>
              </select>
            </label>
          </div>
          <p class="helper-text">※ 未設定ならブラウザ言語を使用</p>
        </section>

        <!-- 字幕表示 -->
        <section class="settings-section">
          <h2>字幕表示</h2>
          <label class="toggle-row">
            <span class="switch">
              <input id="showSidebar" type="checkbox" />
              <span class="slider"></span>
            </span>
            <span class="toggle-label">右側の字幕パネルを表示する</span>
          </label>
          <label class="toggle-row">
            <span class="switch">
              <input id="pinSidebar" type="checkbox" />
              <span class="slider"></span>
            </span>
            <span class="toggle-label">字幕パネルを固定表示する</span>
          </label>
        </section>

        <!-- 音声 -->
        <section class="settings-section">
          <h2>音声</h2>
          <label class="toggle-row">
            <span class="switch">
              <input id="playWordAudio" type="checkbox" />
              <span class="slider"></span>
            </span>
            <span class="toggle-label">単語クリック時に音声再生</span>
          </label>
        </section>

        <!-- AIツールチップ -->
        <section class="settings-section">
          <h2>AIツールチップ</h2>
          <label class="toggle-row">
            <span class="switch">
              <input id="enableAiTooltip" type="checkbox" />
              <span class="slider"></span>
            </span>
            <span class="toggle-label">AI自動翻訳ツールチップ</span>
          </label>
          <p class="helper-text">字幕横の補助翻訳を表示します</p>
          <p class="helper-text">字幕本体は置き換えません</p>
        </section>

        <!-- AIアシスタント -->
        <section class="settings-section">
          <h2>AIアシスタント</h2>
          <div
            class="radio-group"
            role="radiogroup"
            aria-label="使用するAIアシスタント"
          >
            <label class="radio-option">
              <input type="radio" name="preferredAiProvider" value="auto" />
              <span>自動で選ぶ（初期設定）</span>
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="preferredAiProvider"
                value="chrome-built-in"
              />
              <span>Chrome内蔵AI（Gemini Nano）</span>
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="preferredAiProvider"
                value="google-ai-studio"
              />
              <span>Google AI Studio</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="preferredAiProvider" value="groq" />
              <span>Groq</span>
            </label>
          </div>
          <p class="helper-text">
            ※ 自動では Chrome内蔵AI → Google AI Studio → Groq の順で
            利用可能なエンジンを探します
          </p>
        </section>

        <!-- APIキー設定 -->
        <section class="settings-section">
          <h2>APIキー設定</h2>
          <label class="field">
            <span class="field-label">Google AI Studio APIキー</span>
            <div class="secret-input-row">
              <input
                id="googleAiStudioApiKey"
                type="password"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                id="toggleGoogleKey"
                class="secondary-button"
                type="button"
              >
                表示
              </button>
            </div>
          </label>

          <label class="field">
            <span class="field-label">Groq APIキー</span>
            <div class="secret-input-row">
              <input
                id="groqApiKey"
                type="password"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="toggleGroqKey" class="secondary-button" type="button">
                表示
              </button>
            </div>
          </label>

          <p class="helper-text">APIキーはこのブラウザ内に保存されます</p>
        </section>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
